[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-sdr-leadgen"
version = "1.0.0"
description = "A sophisticated lead generation system using natural language queries"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lead Generation Team", email = "team@example.com"}
]
keywords = ["lead generation", "company search", "natural language processing", "coresignal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "pymongo>=4.5.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.0",
    "httpx>=0.25.0",
    # Agent SDK dependencies
    "agents>=0.14.0",
    # MCP dependencies  
    "mcp>=1.0.0",
    # Remove these after migration:
    # "openai>=1.12.0"  # Will be handled by agents SDK
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
leadgen = "core_sdr.__main__:main"

[project.urls]
"Bug Reports" = "https://github.com/example/core-sdr/issues"
"Source" = "https://github.com/example/core-sdr"
"Documentation" = "https://github.com/example/core-sdr/blob/main/README.md"

[tool.setuptools]
packages = ["core_sdr"]
include-package-data = true

[tool.setuptools.package-data]
core_sdr = ["config/*.json", "data/.gitkeep", "logs/.gitkeep"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]