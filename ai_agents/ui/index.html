<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebula</title>
    
    <!-- Preconnect for better font loading performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Figtree Font - Modern, Clean, Professional -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      (function() {
        const isDevelopment = window.location.hostname === 'localhost';
        const baseDomain = window.location.origin;
        const baseURL = isDevelopment ? 'http://0.0.0.0:80' : baseDomain;
        
        // Create script element to load env-config (non-blocking)
        var script = document.createElement('script');
        script.src = baseURL + '/env-config';
        script.type = 'text/javascript';
        script.async = false;
        script.onerror = function() {
          // Silently fail in development - env-config is optional
          console.log('env-config not available, using defaults');
          window.ENV_CONFIG = null;
        };
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
